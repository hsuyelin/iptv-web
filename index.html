<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Old browsers (iOS before 15, among others) lack aspect-ratio, inset and clamp(), and
      // flex gap has no test of its own: aspect-ratio arrived after all of them. They get the
      // plainer layout under .legacy in the stylesheets. Written in ES3 on purpose.
      ;(function () {
        var root = document.documentElement
        try {
          var css = window.CSS
          if (
            css &&
            css.supports &&
            css.supports('aspect-ratio', '1') &&
            css.supports('inset', '0') &&
            css.supports('width', 'clamp(1px, 2vw, 3px)')
          ) {
            return
          }
        } catch (error) {}
        root.className += ' legacy'
      })()
    </script>
    <title>IPTV</title>
    <meta name="description" content="IPTV" />
    <meta name="theme-color" content="#141414" />
    <!-- Home-screen app: the manifest serves current browsers, the Apple tags serve iOS (the
         tags below also work on the old iPads and iPhones this console targets). Launched from
         the home screen it opens without the address bar. "black" keeps the page below the status bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="IPTV" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141414'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23B8444B'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
